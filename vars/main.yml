# vars file
---
jenkins_keyring_src: https://pkg.jenkins.io/debian/jenkins.io-2026.key
jenkins_keyring_dst: /usr/share/keyrings/jenkins-keyring.asc
jenkins_repositories:
  - type: "deb [signed-by={{ jenkins_keyring_dst }}]"
    url: 'https://pkg.jenkins.io/debian'
    component: 'binary/'
jenkins_dependencies_pre:
  - software-properties-common
  - dirmngr
  - apt-transport-https
  - wget
  - coreutils
jenkins_dependencies:
  - curl
jenkins_java_dependencies:
  - default-jre
  - default-jdk
jenkins_url: "http://localhost:{{ jenkins_http_port }}"
jenkins_cli_jar: "{{ jenkins_cli_path }}/jenkins-cli.jar"
jenkins_updates_path: "{{ jenkins_home }}/updates"
jenkins_plugins_path: "{{ jenkins_home }}/plugins"
