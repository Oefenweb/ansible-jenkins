# tasks file
---
- name: repository | install | dependencies (pre)
  apt:
    name: "{{ jenkins_dependencies_pre }}"
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"
  tags:
    - jenkins-repository-install-dependencies

- name: repository | (keyrings) directory | create
  file:
    path: "{{ jenkins_keyring_dst | dirname }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  tags:
    - jenkins-repository-keyrings-directory-create

- name: repository | (keyring) file | download  # noqa command-instead-of-module risky-shell-pipe
  shell: >
    wget -O- {{ jenkins_keyring_src }} | tee {{ jenkins_keyring_dst }}
  args:
    creates: "{{ jenkins_keyring_dst }}"
  tags:
    - jenkins-repository-keyring-file-download

- name: repository | add
  apt_repository:
    repo: "{{ item.type }} {{ item.url }} {{ item.component }}"
    state: present
    update_cache: true
  with_items: "{{ jenkins_repositories }}"
  tags:
    - jenkins-repository-add
